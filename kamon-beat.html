    <p>
        家紋の魅力を「構造美」という視点から再解釈した映像作品。
        家紋を構成する円の大きさに音階と色を対応させ、
        描かれる過程そのものを視覚と音楽で表現した。
        情報を説明するのではなく、
        体験として家紋の美しさを伝えることを目指した。
